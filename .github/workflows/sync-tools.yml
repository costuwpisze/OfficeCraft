name: Sync tools

# Codziennie sprawdza, czy narzędzia mają nowsze wydania, i wdraża je na GitHub Pages.
# Ten sam przebieg można uruchomić ręcznie ze strony /admin/ lub przyciskiem
# "Run workflow" w zakładce Actions.

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tools.txt'
      - '.github/workflows/sync-tools.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Wymuś ponowne pobranie (ignoruj porównanie wersji)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync-tools
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Ustaw Pythona
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Przygotuj katalog buildów
        run: mkdir -p site-out/apps

      - name: Odtwórz pobrane buildy z cache
        uses: actions/cache@v6
        with:
          path: site-out/apps
          key: apps-${{ github.run_id }}
          restore-keys: apps-

      - name: Sprawdź GitHub i pobierz nowe wersje
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 scripts/sync_tools.py --out site-out --config tools.txt ${{ inputs.force && '--force' || '' }}
          echo "--- manifest ---"
          cat site-out/manifest.json

      - name: Zbuduj stronę
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SYNC_WORKFLOW: sync-tools.yml
        run: python scripts/build_site.py --out site-out --config tools.txt

      - name: Czy jest co wdrażać?
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ -f .deploy-needed ] || [ "$EVENT" = "push" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Wykryto zmiany - wdrażam na Pages."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Wszystkie narzędzia są aktualne - pomijam wdrożenie."
          fi

      - name: Skonfiguruj Pages
        if: steps.check.outputs.needed == 'true'
        uses: actions/configure-pages@v6

      - name: Wgraj artefakt
        if: steps.check.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-out
          include-hidden-files: true

      - name: Wdroż na GitHub Pages
        if: steps.check.outputs.needed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
